# NIFTY 50 daily, 2008-03-03 .. 2025-12-30
name: nifty
csv: market_data.csv
target: NIFTY_Close
scale_signal: vix            # India VIX close at the forecast origin
horizons: [1, 3, 5, 10, 20]
levels: [0.80, 0.90, 0.95]
seq_len: 60
lookback_grid: [20, 60, 120]
start_index: 119              # first origin = max(lookback_grid) - 1, identical for all runs
split: {train: 0.70, val: 0.15}
feature_groups: [own, vix, global]
feature_ablation: [[own], [own, vix], [own, vix, global]]
backbone: {hidden: 64, layers: 2, dropout: 0.1, lr: 0.001, batch: 32, epochs: 60, patience: 8, weight_decay: 0.01, df: 4.0}
deeppipe: {epochs: 120, warmup: 40, batch: 32, beta: 0.5, lam: 15.0}
bootstrap_block: 20
seeds: [0, 1, 2, 3, 4]
